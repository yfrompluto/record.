# **************************************************************
# 
# NGINX server block configuration template
# (static frontend + reverse proxy to the backend),
# used by the image's native envsubst mechanism at startup.
#
# **************************************************************

map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
}

#  HTTP -> HTTPS redirection
server {
	listen	8080;
	server_name	transcendence.local;

	return 301 https://$host:8443$request_uri;
}

#  Server block HTTPS
server {
	listen		8443 ssl;
	server_name	transcendence.local;

	ssl_certificate		/etc/nginx/certs/nginx.crt;
	ssl_certificate_key	/etc/nginx/certs/nginx.key;
	ssl_protocols		TLSv1.2 TLSv1.3;

	# Dynamic DNS resolver (docker embedded DNS) so upstream hostnames are
	# re-resolved at request time instead of once at startup, in case
	# something crashes after startup
	resolver	10.89.0.1 valid=10s;

	# Frontend (test page)
	location / {
		root	/usr/share/nginx/html;
		index	index.html;
		try_files $uri $uri/ /index.html;
	}

	#  reverse proxy backend
	location /api/ {

		set $backend_upstream backend;
		rewrite ^/api/(.*)$ /$1 break;
		proxy_pass http://$backend_upstream:3000;
		proxy_http_version	1.1;

		proxy_set_header	Host			$host;
		proxy_set_header	X-Real-IP		$remote_addr;
		proxy_set_header	X-Forwarded-For	$proxy_add_x_forwarded_for;
		proxy_set_header	X-Forwarded-Proto	$scheme;
	}

	# Avatars; default one, then gets changed when user updates its profile
   location /avatars/ {
		root /usr/share/nginx;
   }

   location /api/users/me/avatar {
      modsecurity off;

      proxy_pass        http://backend:3000/users/me/avatar;
      proxy_http_version 1.1;
      proxy_set_header  Host              $host;
      proxy_set_header  X-Real-IP         $remote_addr;
      proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header  X-Forwarded-Proto $scheme;
   }

	# WebSocket proxy for real-time chat
	location /socket.io/ {
		modsecurity off;
		
		set $backend_upstream backend;
		proxy_pass        http://$backend_upstream:3000;
		proxy_http_version	1.1;
		proxy_buffering off;
		proxy_request_buffering off;

		proxy_set_header	Upgrade				$http_upgrade;
		proxy_set_header	Connection			$connection_upgrade;
		proxy_set_header	Host				$host;
		proxy_set_header	X-Real-IP			$remote_addr;
		proxy_set_header	X-Forwarded-For		$proxy_add_x_forwarded_for;
		proxy_set_header	X-Forwarded-Proto	$scheme;
	}
}